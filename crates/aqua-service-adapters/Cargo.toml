[package]
name = "aqua-service-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2.103"

[features]
default = []
wireplumber-native = []

[[bin]]
name = "aqua-audio-adapter-probe"
path = "src/bin/aqua-audio-adapter-probe.rs"
required-features = ["wireplumber-native"]

[[bin]]
name = "aqua-network-broker"
path = "src/bin/aqua-network-broker.rs"
