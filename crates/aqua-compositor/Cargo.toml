[package]
name = "aqua-compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "aqua-compositor"

[dependencies]
aqua-installer = { path = "../aqua-installer" }
aqua-renderer = { path = "../aqua-renderer" }
aqua-scene = { path = "../aqua-scene" }
aqua-shell = { path = "../aqua-shell" }
calloop = "0.14.4"
png = "0.18.1"
portable-pty = "0.9.0"
vt100 = "0.16.2"

[features]
default = []
smithay-smoke = ["dep:input", "dep:libc", "dep:smithay", "dep:tempfile", "dep:wayland-client", "dep:wayland-protocols"]
smithay-gpu = ["smithay-smoke", "smithay/backend_drm", "smithay/backend_egl", "smithay/backend_gbm", "smithay/renderer_gl"]

[target.'cfg(target_os = "linux")'.dependencies]
drm = "=0.14.1"
input = { version = "0.9.0", default-features = false, features = ["libinput_1_19", "udev"], optional = true }
libc = { version = "0.2.103", optional = true }
polling = "3.11.0"
wayland-server = "=0.31.14"
smithay = { version = "0.7.0", default-features = false, features = ["backend_libinput", "udev", "wayland_frontend"], optional = true }
tempfile = { version = "3.27.0", optional = true }
wayland-client = { version = "=0.31.14", optional = true }
wayland-protocols = { version = "=0.32.12", default-features = false, features = ["client", "server"], optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "aqua-compositor"
path = "src/main.rs"

[[bin]]
name = "aqua-files"
path = "src/bin/aqua-files.rs"
required-features = ["smithay-smoke"]

[[bin]]
name = "aqua-settings"
path = "src/bin/aqua-settings.rs"
required-features = ["smithay-smoke"]

[[bin]]
name = "aqua-properties"
path = "src/bin/aqua-properties.rs"
required-features = ["smithay-smoke"]

[[bin]]
name = "aqua-terminal"
path = "src/bin/aqua-terminal.rs"
required-features = ["smithay-smoke"]

[[bin]]
name = "aqua-installer"
path = "src/bin/aqua-installer.rs"
required-features = ["smithay-smoke"]
