[package]
name = "aqua-host-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aqua-compositor = { path = "../aqua-compositor" }
aqua-renderer = { path = "../aqua-renderer" }
aqua-scene = { path = "../aqua-scene" }
minifb = { version = "0.28.0", optional = true }

[features]
default = []
host-window-preview = ["dep:minifb"]

[[bin]]
name = "aqua-host-tools"
path = "src/main.rs"
