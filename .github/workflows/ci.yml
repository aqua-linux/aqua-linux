name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install contract-check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            libegl1-mesa-dev \
            libgbm-dev \
            libinput-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Repository and contract checks
        run: |
          scripts/check-assets.sh
          scripts/check-visual-preview.sh
          scripts/check-progress-report.sh
          scripts/check-public-repo.sh
