name: Sync issue labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create or update canonical labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('.github/labels.yml', 'utf8').split(/\r?\n/);
            const labels = [];
            let current = null;

            for (const line of lines) {
              const name = line.match(/^- name: (.+)$/);
              const color = line.match(/^  color: ([0-9a-f]{6})$/);
              const description = line.match(/^  description: (.+)$/);
              if (name) {
                if (current) labels.push(current);
                current = { name: name[1] };
              } else if (color && current) {
                current.color = color[1];
              } else if (description && current) {
                current.description = description[1];
              }
            }
            if (current) labels.push(current);

            for (const label of labels) {
              if (!label.name || !label.color || !label.description) {
                core.setFailed(`Incomplete label entry: ${JSON.stringify(label)}`);
                return;
              }
            }

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const byName = new Map(existing.map((label) => [label.name, label]));

            for (const label of labels) {
              const found = byName.get(label.name);
              if (found) {
                if (found.color !== label.color || found.description !== label.description) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } else {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              }
            }

            core.info(`Synchronized ${labels.length} labels without deleting repository-defined labels.`);
