[foundation]
selected = "smithay"
version = "0.7.0"
license = "MIT"
rust_version = "1.80.1"
status = "selected-scene-model-spike"
smithay_features = ["wayland_frontend"]
smithay_feature_gate = "smithay-smoke"
smithay_gpu_feature_gate = "smithay-gpu"
event_loop = "calloop"
event_loop_version = "0.14.4"
scene_model = "aqua-scene"
component_system = "the independent aqua-components crate owns renderer-neutral component inventory, anatomy, stable state geometry, input activation, and accessibility semantics; all 22 catalog entries are shared primitives, including the bounded slider; the shell brand, clock, status icons, and pointer-enabled Session control consume shared top-system-bar geometry; Applications and Global Search consume shared search-field geometry, Files consumes shared toolbar and back/forward icon-button geometry, Settings consumes shared switch, theme-segment, and audio-volume slider geometry, and Installer Summary consumes a target-bound shared destructive-acknowledgement checkbox before its model-owned exact-text confirmation; Settings plus Files consume identical sidebar row geometry, Terminal, Files, Settings, and Properties consume shared window-frame render and input geometry, Applications cards plus desktop Files, Settings, and Trash cells consume shared grid-cell render and pointer geometry, Applications mode composes its surface, title, search, grid, and pointer routing through shared application-overview geometry, Global Search composes its split results, quick actions, rendering, and exact pointer routing through shared global-search geometry, the centered bottom app group composes its surface, item targets, icon slots, running indicators, and pointer routing through shared running-app-dock geometry, the bottom-right group composes its three targets, thumbnails, active indicator, and pointer routing through shared workspace-switcher geometry, shell notification drawing plus compositor pointer and Escape dismissal share bounded notification geometry, Session, Empty Trash, and Installer real-mode prompts share confirmation geometry and intent semantics while retaining model-owned authorization gates, desktop context actions share menu drawing and pointer geometry, Session actions consume shared menu row geometry, Settings plus Properties derive bounded heading, row, trailing-control, and footer placement from shared section-group geometry, and Properties plus System Overview consume bounded read-only metadata label/value columns"
settings_audio_volume = "Settings owns a persistent bounded 0-100 output-volume preference and mute state, exposes them through the shared slider and switch, and fails controls closed unless aqua-service-adapters supplies a ready authoritative snapshot with a valid default output route; /dev/snd alone is insufficient, displayed values remain authoritative, and no playback, packaged native binding, or physical-hardware support is claimed"
audio_service_stack = "ADR 0004 selects ALSA and eudev below per-user PipeWire plus WirePlumber, with an Aqua service adapter consuming authoritative API state; Buildroot 2025.02.17 plus the locked aqua UID/GID 1000 session, private /run/user/1000, and explicit device groups satisfy the baseline identity prerequisite; the packaged media supervisor provides finite ordered lifecycle, aqua-service-adapters provides fail-closed state and intent reconciliation, and the separate audio rehearsal profile proves the narrow legal-info closure while default packages stay disabled pending native binding and real QEMU media evidence"
audio_service_adapter = "the renderer-independent aqua-service-adapters crate bounds device count and identifiers, validates typed input/output routes, rejects stale and conflicting generations atomically, preserves desired volume, mute, and output route across unavailable or degraded service state, emits at most one reconciliation request, and reports backend_applied only after a newer authoritative state confirms the pending intent"
audio_api_transport = "PipeWireApiTransport maps bounded graph-synchronized PipeWire/WirePlumber snapshots to authoritative state and maps volume, mute, and configured-default-output requests to typed API calls; the opt-in aqua-audio-native package implements the WirePlumber 0.5 object-manager, mixer, and default-node calls through ABI version 1 with fixed node and text bounds, finite waits, UTF-8 validation, and synchronized acknowledgments; Settings can drive one snapshot-submit cycle, failed submission is retryable, and no request is applied before a newer snapshot acknowledges it"
audio_buildroot_rehearsal = "the non-default aqua_x86_64_audio_rehearsal_defconfig resolves PipeWire 1.2.8, WirePlumber 0.5.5, alsa-lib 1.2.13, eudev 3.2.14, Lua 5.4.8, GLib 2.82.5, and the MIT aqua-audio-native bridge; the bridge is selected only in this profile, optional compatibility stacks stay disabled, generated evidence is local, and release_cleared remains false"
media_service_supervisor = "the unprivileged graphical supervisor owns a packaged BusyBox-compatible media supervisor under /run/user/1000; deterministic fixtures prove PipeWire readiness precedes WirePlumber, one forced failure restarts the complete pair within budget, repeated failure becomes degraded, clean stop terminates WirePlumber before PipeWire, and the package-absent rootfs default remains disabled without a root media daemon"
unprivileged_session = "the root boot gate prepares /run/user/1000 and /run/aqua as aqua-owned mode-0700 directories, then a non-symlink allowlisted launcher drops to locked UID/GID 1000 before the bounded supervisor and compositor execute; video, audio, and input supplementary groups provide explicit device access while the root recovery TTY remains independent"
buildroot_lts = "Buildroot 2025.02.17 LTS is pinned by SHA-256, built in a versioned Docker volume, and protected by archive and extracted-source integrity checks that quarantine incomplete state before an atomic re-extract"
installer_state = "aqua-installer owns the canonical nine-step state machine, required-selection gates, dry-run and real mode separation, password-free user metadata, and exact target-bound destructive confirmation"
installer_ui_contract = "shared aqua-scene geometry defines a responsive installer window, title bar, step rail, content, footer, controls, and progress track for 800x600 through 1536x1024; all nine Turkish step labels and step-specific keyboard focus/action orders are tested while the packaged readiness probe explicitly reports rendered=false"
installer_welcome_raster = "aqua-renderer produces deterministic 1280x800 RGBA and PNG Welcome output from synchronized installer/UI state, shared geometry, embedded Noto Sans, and the real transparent Aqua symbol; malformed image buffers, stale steps, unsupported viewports, and lost source alpha fail tests, and the same raster is QEMU-validated through the packaged Wayland client"
installer_language_keyboard_forms = "bounded three-entry language and keyboard catalogs apply only validated installer model values; aqua-renderer produces deterministic selected and applied form rows for both steps, the Buildroot readiness probe exports the matching catalog contract, and QEMU keyboard input now reaches and repaints both packaged forms"
installer_disk_form = "the bounded storage inventory feeds a keyboard-navigable disk form that retains blocked devices for presentation, skips them for selection, and applies only an eligible converted target on activation; the deterministic Partitions raster presents device identity, capacity, destructive warning, and canonical EFI/root layout"
installer_timezone_form = "a bounded four-entry IANA timezone catalog feeds tested keyboard selection and model synchronization; the deterministic Time Zone raster presents localized city and region labels plus selected and applied states while preserving the installed timezone metadata contract"
installer_user_form = "bounded username and display-name editing feeds the validated UserProfile while password character events are explicitly ignored; only password_configured enters form state, model, raster status, and password-free install metadata, and a deterministic User Information PNG covers the applied profile"
installer_summary_form = "the deterministic Summary raster presents all validated install selections and mode; dry-run is immediately ready while real mode requires the exact current-target confirmation phrase, and target or mode changes invalidate prior authorization before live Wayland presentation"
installer_wayland_surface = "a packaged manual /usr/bin/aqua-installer presents deterministic 1280x800 rasters as an aqua.installer wl_shm xdg-toplevel using the runtime Aqua symbol and real Linux storage inventory; QEMU proves full-output DRM composition and matching input origin without desktop chrome, routes real virtio pointer footer and form clicks plus 106 virtio-keyboard press/release events through libinput, Aqua Seat, and Wayland from Welcome through Completed, applies locale, layout, /dev/vdb, timezone, bounded username/display name, password-configured status, target-bound destructive acknowledgement, and the exact uppercase ERASE confirmation, rejects password content from state and serial logs, and records 35 client rerenders with seven distinct screendumps while autostart and transaction execution remain disabled"
installer_storage_probe = "bounded read-only Linux inventory reads sysfs, mountinfo, and kernel root metadata; excludes partitions and pseudo devices; and blocks running-root, read-only, and zero-capacity targets before InstallTarget creation"
installer_dry_run_plan = "deterministic structured plan records exact target identity, labeled GPT plus 512 MiB EFI and ext4 root layout, rootfs and kernel destinations, GRUB2 x86_64 UEFI fallback installation, stable fingerprint, zero unresolved plan blockers, and execution_allowed=false without dispatching commands"
installer_bootloader = "GRUB2 x86_64 UEFI is selected; Buildroot emits efi-part/EFI/BOOT/bootx64.efi and the installer plans EFI/BOOT/BOOTX64.EFI plus grub.cfg using root=PARTLABEL=AQUA_ROOT while direct-kernel QEMU boot remains available"
installer_prerequisites = "Buildroot packages sfdisk, mkfs.fat, mkfs.ext4, GNU tar, mount, and umount; post-image and Rust validation require bounded absolute executable paths before an install may proceed"
installer_target_revalidation = "a fresh bounded storage probe must match device path, stable identity, model, and capacity and still consider the disk eligible immediately before destructive operations"
installer_command_rehearsal = "the canonical plan compiles without shell interpolation to eight bounded absolute-program argv specifications; a recording runner validates order and always reports executed=false while file/configuration work is handed to the separate Rust internal rehearsal"
installer_internal_rehearsal = "eleven Rust-owned actions prepare target mountpoints, atomically copy kernel and EFI artifacts, generate GRUB configuration, and atomically write bounded password-free system metadata; every destination stays below /mnt/aqua-target and the runner performs no writes"
installer_transaction_rehearsal = "a fingerprint-bound 20-step graph interleaves target revalidation, eight commands, and eleven internal actions; injected failures schedule cleanup only for completed mounts in EFI-then-root order while normal rehearsal finishes with no redundant cleanup and executed=false"
installer_live_progress = "transaction-bound events map the next real step to stable preparing, partitioning, formatting, system, bootloader, configuration, and finalization phases; running and failed events remain below 100 percent, completion requires all 20 steps plus completed installer state, and QEMU validates success and injected-failure records"
installer_wayland_progress_presentation = "an explicit QEMU-only presentation rehearsal compiles the confirmed live model into the canonical 20-step graph, requires NonExecutingInstallTransactionRunner executed=false, renders active phase plus 40, 65, and 95 percent checkpoints, reaches Completed at 20 of 20 and 100 percent, and logs transaction_executed=false without process dispatch or filesystem writes"
installer_pointer_footer = "responsive layout hit-testing covers visible Language, Cancel, Back, Forward or Install, and Restart controls; hidden step-specific controls reject hits, and the packaged Wayland client routes accepted button presses through the same InstallerUiAction and model validation gates as keyboard activation"
installer_pointer_forms = "choice, disk, and user-field rows share exact responsive rectangles between aqua-renderer and InstallerWindowLayout hit-testing; bounded catalog clicks apply validated values, blocked disks reject hits, eligible disk clicks never apply a target, user clicks never apply a profile, and both sensitive states retain explicit Step Content activation"
installer_pointer_qemu = "the packaged installer QEMU acceptance includes a virtio mouse, maps aqua.installer input to the same zero origin as full-output presentation, advances Welcome through a real footer click, selects the Turkish Language row after repaint synchronization, and then completes the existing keyboard and graph-bound progress path without enabling transaction execution"
gpu_client_texture_cache = "the native GLES renderer retains unchanged client textures by surface id, real Wayland commit revision, and source dimensions; changed or resized surfaces are uploaded again and removed surfaces are evicted"
gpu_opaque_full_output_fast_path = "the Aqua installer supplies a complete standard Wayland opaque region; after one GLES validation frame, a same-size full-reference-output client with no visible surface overlays may use the QEMU dumb-buffer bridge while partial or undeclared surfaces retain normal composition"
gpu_native_timing_markers = "native QEMU rendering reports client upload, cache hits, uploads, opaque-cover decision, submit/sync, readback, block checksum, XRGB pack, direct-bridge use, and total-frame milliseconds; packaged installer acceptance recorded 30 direct frames at a 61 ms median total on 2026-08-22"
installer_fixture_executor = "an empty real directory under the system temporary root remaps /mnt/aqua-target and executes only the eleven internal actions; atomic kernel, EFI, GRUB, and system metadata writes are verified while symlinks fail closed and disk_commands_executed remains false"
installer_tool_shim_runner = "only executable non-symlink programs below a temporary capability root receive exact argv and bounded stdin with a cleared environment; non-zero exit and two-second timeout propagate the transaction cleanup plan while real_disk_tools_executed remains false"
installer_execution_gate = "QEMU DMI, explicit kernel opt-in, exact operator enable value, three non-empty regular staged artifacts, one freshly revalidated eligible target, and exact target-bound ERASE confirmation must all pass before installer state can be armed; the gate starts no transaction and QEMU proves the disposable disk hash remains unchanged"
installer_artifact_staging = "a dedicated ext4 disk carries the real Buildroot rootfs.tar, bzImage, and bootx64.efi plus an exact three-entry SHA-256 manifest; QEMU mounts blocked /dev/vdc read-only, shell and Rust independently verify all digests, and /dev/vdb remains the sole eligible target"
installer_qemu_transaction = "a second exact opt-in executes the fingerprint-bound 20-step graph only against disposable QEMU /dev/vdb; sector-based GPT, FAT EFI, ext4 root, real rootfs extraction, atomic kernel/EFI/GRUB/configuration writes, and ordered unmount complete while host hashes prove the artifact disk unchanged"
installer_installed_root_boot = "a second QEMU process boots installed /dev/vda2 with the external development kernel; a third uses EDK2 pflash without -kernel, discovers fallback BOOTX64.EFI, runs GRUB 2.12, resolves root=PARTLABEL=AQUA_ROOT, confirms EFI runtime, and reaches text recovery"
installer_failure_cleanup = "an exact QEMU-only AFTER_EFI_MOUNT injection stops the real transaction after both filesystems are mounted; observed-state cleanup completes EFI then root unmount, /proc/mounts confirms both cleared, both filesystems remain readable, and the artifact disk hash remains unchanged"
host_note = "Smithay Wayland smoke is Linux-targeted; macOS local runs use a stub because xkbcommon is a system link dependency."
socket_smoke = "bind_absolute lifecycle with nonblocking accept, local client insert, and cleanup"
calloop_socket_smoke = "Generic<ListeningSocket> dispatch with local client insert, dispatch_clients, and flush_clients"
session_skeleton = "AquaCompositorSession owns Display and compositor state for insert, dispatch, and flush"
session_config = "recovery-safe nested-dev defaults for socket, runtime dir, assets, autostart, boot graphics, and fallback TTY"
session_env = "derived environment contract for WAYLAND_DISPLAY, XDG_RUNTIME_DIR, AQUA_ASSET_ROOT, autostart, and boot graphics"
session_bootstrap = "config-driven runtime directory preparation without compositor autostart, boot graphics, or desktop shell"
session_run_once = "AquaCompositorSession run-once smoke accepts one local client, dispatches, flushes, and cleans up"
session_loop = "AquaCompositorSession bounded loop smoke runs three dispatch/flush passes after accepting one local client"
static_shell_scene = "wallpaper, top panel, desktop icon column, dock, launcher, system overview, and notification toast geometry"
scene_asset_bindings = "runtime wallpaper, brand, and permanent Aqua Core Icon paths are part of the scene dump contract"
scene_material_tokens = "bright Aqua surfaces reference shared surface, border, shadow, color, and layout token paths; blurRequired=false"
renderer_plan = "aqua-renderer produces headless draw command plans without drawing or boot graphics"
paint_plan = "aqua-renderer produces deterministic paint order, opacity, blend, and legacy effect steps without drawing pixels"
frame_plan = "aqua-renderer defines rgba8888 frame size, stride, buffer byte count, clear color, and full damage rect without allocating display output"
frame_buffer = "aqua-renderer allocates and clears an in-memory rgba8888 software framebuffer without DRM, KMS, Wayland output, or boot graphics"
software_raster = "aqua-renderer fills the static paint plan into the software framebuffer and verifies wallpaper/surface/interior/edge/highlight sample pixels plus a full-buffer checksum without display output"
surface_primitives = "legacy-named aqua-renderer helpers draw deterministic rounded edge, highlight, and inset-shadow primitives in software without requiring blur, DRM, KMS, Wayland output, or boot graphics"
gpu_runtime_abi = "Buildroot packages Mesa GBM, EGL, OpenGL ES, virgl, and software Gallium support; the Aqua compositor compiles Smithay DRM, GBM, EGL, and GLES renderer modules while retaining the software raster path as the default fallback"
gpu_offscreen_frame = "real QEMU virtio-gpu creates a bounded GBM/EGL context and Smithay GLES renderer, decodes and uploads the packaged 1536x1024 wallpaper, runs it through synchronized horizontal and vertical 9-sample Gaussian blur passes using two 320x240 intermediate GPU textures, keeps the desktop background sharp, and feeds only the blurred result into five aqua-surface-compositor-v1 panels with bounded refraction, cyan tint, top highlight, antialiased rounded masks, and inner edge lighting; two ABGR8888 readbacks have equal checksums before recovery-safe cleanup without KMS activation or display output"
gpu_visible_kms_frame = "explicitly confirmed QEMU paths compose the layered system-surface scene plus wl_shm textures with Smithay GLES2/GBM. The bounded DRM-Wayland session still reads back the validated 320x240 RGBA frame into Xrgb8888 dumb buffers, while a separate direct presenter renders the same scene into native 1280x800 GBM dma-bufs without a CPU scanout copy, submits an event-confirmed page flip, captures active scanout, restores CRTC, and returns to recovery"
gbm_scanout_buffer = "real QEMU virtio-gpu allocates two 1280x800 Xrgb8888 GBM buffers on card0 with SCANOUT and RENDERING usage, exports each as a one-plane dma-buf, registers both through DRM ADDFB2 with 5120-byte pitch, and validates cleanup without modesetting"
gbm_direct_scanout = "explicitly confirmed bounded QEMU presenter creates EGL and GBM on card0, renders the Aqua layered system-surface scene into front and back dma-bufs, performs no CPU copy into scanout, modesets the front buffer, page-flips to the back buffer, receives the completion event, captures 1280x800 scanout with checksums, restores the original CRTC, destroys both framebuffers, and returns to text recovery; integration into the live Wayland session remains pending"
raster_export = "aqua-renderer exports the deterministic software raster to a PPM artifact for inspection without boot graphics or display output"
raster_png_export = "aqua-renderer exports the deterministic software raster to a dependency-free PNG artifact for visual inspection without boot graphics or display output"
typography_qemu = "a packaged acceptance-only aqua.typography-acceptance wl_shm client presents the accepted 1280x800 Turkish and Arabic label layout through the real Smithay and DRM path; one recovery-safe QEMU boot captures all four themes as distinct nonblank PNGs, verifies bounded client and KMS cleanup after each capture, and never enables autostart or persistent boot graphics"
elevation_qemu = "a dedicated recovery-safe QEMU scenario maps two packaged wl_shm xdg-toplevel fixtures, assigns focus to exactly one surface, and captures all four themes through the real Smithay GLES and DRM path; serial gates prove one active-window shadow, one inactive dialog shadow, two reusable mask uploads, two viewport-bounded damage regions, client cleanup, CRTC restoration, and return to recovery after every capture"
icon_qemu = "a dedicated recovery-safe packaged QEMU scenario composites scale-native Aqua Core Icon rasters into the live top bar, desktop, dock, and notification textures in all four themes; each bounded session proves seven parsed SVG roles, ten physical raster keys, three cache hits after a forced dock texture refresh, zero eviction, a distinct 1280x800 capture, CRTC restoration, and return to recovery"
component_qemu = "a packaged acceptance-only aqua.component-acceptance wl_shm client presents all twenty-two shared component primitives from aqua-component-fixtures-19 through the real Smithay, GLES, and DRM path; one recovery-safe QEMU boot captures all four themes as distinct nonblank 1280x800 PNGs, verifies the 22-entry catalog and 22 shared primitives, stops each managed client, restores compositor and CRTC state, and returns to recovery without enabling autostart or installer execution"
display_output_plan = "recovery-safe nested-dev output contract for 1536x1024 rgba8888, with qemu-drm-kms reserved for QEMU hardware validation and no renderer or boot graphics started"
display_output_handoff = "recovery-safe handoff contract proving the composited raw rgba8888 preview frame format/checksum, full client-buffer snapshots, and framebuffer metadata are ready for the nested-dev output path without starting display output, renderer, desktop shell, or boot graphics"
display_activation_plan = "manual-dev activation gate proving the display-output handoff can be promoted toward controlled startup while fallback TTY remains required and display output, renderer, desktop shell, boot graphics, and autostart remain stopped"
drm_device_probe = "recovery-safe read-only DRM card discovery records connected connectors and advertised modes in rootfs and real QEMU virtio-gpu without acquiring DRM master, activating KMS, starting display output, or enabling boot graphics"
drm_dumb_buffer_probe = "real QEMU virtio-gpu allocates and maps one bounded 1280x800 Xrgb8888 dumb buffer, copies the composited Aqua frame with pitch-aware layout, verifies the checksum, destroys the buffer, and returns to recovery without creating a KMS framebuffer, modesetting, or page flipping"
drm_kms_present = "explicitly confirmed real QEMU virtio-gpu path creates a 1280x800 Xrgb8888 legacy KMS framebuffer, activates one bounded Aqua scanout, captures it through the QEMU monitor, restores the original CRTC, destroys framebuffer and dumb-buffer resources, and returns to recovery without page flipping, autostart, or a persistent graphical session"
drm_page_flip = "explicitly confirmed real QEMU virtio-gpu path uses two KMS framebuffers, submits one DRM page flip with event delivery, waits with a bounded timeout for the matching CRTC event, captures the resulting scanout, restores the original CRTC, releases both framebuffers and dumb buffers, and returns to recovery without a repeating frame loop or autostart"
drm_frame_loop = "explicitly confirmed real QEMU virtio-gpu path alternates two KMS framebuffers across three ordered page flips, requires one completion event before each next submission with finite per-event timeouts, captures the active scanout, restores the CRTC, releases all resources, and returns to recovery without persistent compositor startup"
drm_session_loop = "explicitly confirmed real QEMU path places the DRM fd under a calloop Generic event source owned by aqua-compositor, dispatches three ordered page-flip completions, captures the active scanout, releases the source and KMS resources, restores the CRTC, and returns to recovery while Wayland display startup remains disabled"
drm_wayland_session = "explicitly confirmed real QEMU path keeps Smithay compositor, shm, xdg-shell, Aqua Seat, and a session-owned GLES renderer alive in one bounded lifecycle; card0 owns KMS, EGL, and native GBM front/back scanout buffers, and the reused context follows the live wl_shm texture lifecycle from initial and stacking frames through Files and Settings to one surviving client and the zero-client desktop; every tested repaint renders directly into the inactive dma-buf without CPU scanout copy or framebuffer readback, derives diagnostics from surface inputs, page-flips, restores CRTC, releases GBM resources, and returns to text recovery"
graphical_session_persistent = "the explicit aqua.boot_graphics=1 profile runs the supervised DRM-Wayland session with persistent-until-stop lifetime policy while manual and diagnostic profiles retain bounded holds; default boot_graphics=false and autostart=false remain unchanged"
graphical_session_cycle = "QEMU verifies fixture-free production boot start, controlled stop, second supervised start, and second controlled stop; both cycles restore CRTC, release GBM scanout buffers, remove the Wayland socket and supervisor PID, and return to the recovery shell, while the separate qemu-integration scenario retains explicit external-client cleanup coverage"
graphical_session_scenarios = "production aqua.boot_graphics=1 uses desktop-event-loop with external_fixture_clients_started=false; upstream Weston compatibility fixtures, Aqua test clients, and scripted Files/Settings interactions are available only through the explicit qemu-integration diagnostic scenario"
graphical_session_empty_desktop = "the fixture-free production session creates the Smithay GLES compositor and native GBM scanout path with zero client surfaces, renders the Aqua desktop, remains active until controlled stop, and passes two QEMU start-stop cycles"
graphical_session_runtime_launcher = "QEMU injects real launcher keyboard and pointer input into the fixture-free desktop-event-loop session; the compositor consumes the Files launch request, applies executable allowlist preflight, starts the packaged Aqua Files process under the runtime supervisor, accepts its new xdg-toplevel dynamically as aqua.files, repaints the native GBM scanout with one client surface, and terminates and reaps the process during controlled session stop"
graphical_session_runtime_damage = "the fixture-free production event loop dispatches and flushes Wayland clients continuously, tracks compact surface revisions across commit, damage, frame callback, buffer checksum, geometry, mapping, destruction, and cleanup state, and repaints only when launcher or client state changes; QEMU launches supervised Aqua Files and Aqua Settings together, closes the launcher after activation, routes a real pointer category interaction to aqua.settings, observes the updated wl_shm buffer, repaints native GBM scanout, and cleans both processes during controlled stop"
graphical_session_application_exit = "first-party user applications use an explicit restart_policy=never contract; Alt+F4 sends xdg_toplevel.close to the focused Aqua Settings client, which exits cleanly, while QEMU also forces an unexpected Aqua Files process exit. The persistent event loop reaps both outcomes, records success independently, removes disconnected stale surfaces, repaints from two clients to one and then zero, leaves no supervised process active, and keeps the compositor session running until its separate controlled stop"
display_output_smoke = "manual-dev bounded display-output smoke starts and stops three nested-dev frames from the activation gate while renderer, desktop shell, boot graphics, and autostart remain disabled"
nested_output_surface = "manual-dev nested output surface lifecycle smoke acquires, configures, attaches, presents, and releases the bounded display-output frame while renderer, desktop shell, boot graphics, and autostart remain disabled"
visible_preview_plan = "readiness contract that joins output, scene, render, paint, frame, framebuffer, raster, PNG export, and client-layer pipeline probes before opening any nested preview window"
visible_preview_export = "single-file HTML data-uri preview artifact generated from the deterministic PNG raster with client-layer paint steps composited into the image, without opening a window, starting the renderer, or enabling boot graphics"
nested_preview_loop = "manual-dev bounded frame clock over the visible preview export path, proving three preview frames without compositor autostart, boot graphics, or a persistent desktop process"
manual_nested_preview_backend = "rootfs-verified manual nested preview backend path joins display-output handoff, nested output surface lifecycle, visible preview export, and bounded frame loop behind the recovery handoff gate while keeping fallback TTY, autostart=false, boot_graphics=false, display_output_started=false, and the desktop shell stopped"
manual_nested_preview_execution = "rootfs-verified operator-controlled manual nested preview execution validates handoff gate, manual backend readiness, bounded three-frame execution, cleanup, fallback TTY, and safe recovery return while keeping autostart=false, boot_graphics=false, preview_window_started=false, and desktop shell stopped"
host_nested_output_presenter = "manual aqua-host-tools presenter probe consumes the compositor display-output handoff and nested output surface lifecycle while staying outside the Buildroot rootfs and without starting display output, boot graphics, compositor autostart, or the desktop shell"
host_preview_window = "feature-gated aqua-host-tools minifb window lifecycle probe and manual 3-frame smoke for development preview from the display-output handoff, nested output surface lifecycle, and composited raw rgba8888 client-layer frame; full preview remains bounded to 600 frames when explicitly launched and is not packaged into the Buildroot rootfs"
manual_execution_window_bridge = "feature-gated aqua-host-tools bridge proving the rootfs-safe manual nested preview execution frame checksum can feed the host minifb visible preview path; smoke remains manual, bounded to three frames, and outside the Buildroot rootfs"
host_dev_handoff_summary = "host-side aqua-host-tools summary pairs the rootfs-exported visible-preview launcher artifact with the bounded host visible-preview smoke command while keeping host tooling outside the Buildroot rootfs and avoiding any automatic QEMU graphical boot"
visible_preview_request = "QEMU-safe recovery command records a manual host-visible preview request after the manual nested preview execution path passes; it writes only /run/aqua request metadata, keeps host preview tooling outside the Buildroot rootfs, and preserves autostart=false and boot_graphics=false"
visible_preview_launch = "QEMU-safe recovery launcher turns the manual host-visible preview request into a bounded launch plan; it writes /run/aqua launch metadata, keeps host preview tooling outside the Buildroot rootfs, avoids opening a QEMU window, and preserves autostart=false and boot_graphics=false"
recovery_operator_help = "QEMU recovery helper lists the manual compositor and visible-preview operator commands from the text shell while preserving autostart=false, boot_graphics=false, and host preview tooling outside the Buildroot rootfs"
operator_transcript = "QEMU recovery dry-run transcript writes the ordered manual recovery command sequence and matching host preview commands under /run/aqua while preserving autostart=false, boot_graphics=false, fallback TTY, and host tooling outside the Buildroot rootfs"
graphics_enable_gate = "QEMU recovery manual graphics enable gate evaluates the allow preflight contract and supports a positive dry-run decision against handoff and manual execution logs, while default recovery mode still refuses startup with boot_graphics=false and autostart=false, writes the plan under /run/aqua, and returns safely to text recovery"
graphics_launch_candidate = "QEMU recovery supervised no-start launch candidate consumes the positive graphics enable dry-run gate, records rollback metadata, keeps actual_graphics_started=false, display_output_started=false, boot_graphics=false, and returns safely to text recovery"
graphics_rollback_drill = "QEMU recovery supervised rollback drill consumes the no-start launch candidate, simulates operator cancel and startup failure paths, verifies rollback_command=/usr/bin/aqua-recovery, keeps actual_graphics_started=false and display_output_started=false, and returns safely to text recovery"
graphics_startup_preflight = "QEMU recovery guarded startup preflight consumes the rollback drill, verifies bounded startup criteria, operator acknowledgement, fallback TTY, rollback metadata, max frame and timeout limits, keeps actual_graphics_started=false and display_output_started=false, and returns safely to text recovery"
graphics_startup_rehearsal = "QEMU recovery guarded startup rehearsal consumes the startup preflight and bounded display-output smoke log, proves a three-frame manual run started and stopped, preserves fallback TTY, autostart=false, boot_graphics=false, desktop_shell_started=false, and returns safely to text recovery"
graphics_qemu_display_gate = "QEMU recovery manual QEMU display-step gate consumes the startup rehearsal, allows only an operator-triggered first visible QEMU compositor run, keeps visible_qemu_step_started=false, actual_graphics_started=false, boot_graphics=false, autostart=false, and returns safely to text recovery"
graphics_visible_qemu_attempt = "QEMU recovery first visible QEMU compositor attempt plan consumes the manual display-step gate, records /usr/bin/aqua-compositor-guarded-run as the bounded attempt command, keeps visible_qemu_attempt_started=false, actual_graphics_started=false, boot_graphics=false, autostart=false, and returns safely to text recovery"
graphics_visible_attempt_transcript = "QEMU recovery manual visible-attempt execution transcript consumes the visible QEMU attempt plan, records the operator command sequence, expected three-frame bounded run, expected safe recovery return, persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
graphics_visible_attempt_result = "QEMU recovery visible-attempt result collector consumes the transcript and records the safe default manual-not-run result, or a bounded run result when an operator-provided run log exists, while keeping persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
graphics_visible_attempt_runner = "QEMU recovery explicit visible-attempt runner consumes the transcript, runs /usr/bin/aqua-compositor-guarded-run only when explicitly invoked, collects the completed bounded result, and keeps persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
graphical_session_supervisor = "Rootfs graphical-session supervisor requires explicit boot_graphics and runtime enablement, records atomic state, limits rapid compositor failures to three restarts, resets accounting after a stable run, and invokes text recovery when the restart budget is exhausted; QEMU proves three real compositor startup failures, two bounded restarts, and recovery return while current image defaults remain boot_graphics=false and autostart=false"
graphical_session_boot = "Rootfs activation gate starts the supervisor only when the kernel command line contains the exact aqua.boot_graphics=1 flag and the separate graphics profile explicitly enables boot graphics plus supervised autostart while requiring recovery TTY; PID tracking rejects duplicate sessions, and default QEMU boot proves the gate remains disabled"
graphical_session_boot_qemu = "Opt-in QEMU boot with aqua.boot_graphics=1 proves rcS starts the packaged supervisor, the real DRM-Wayland compositor reaches active state with boot_graphics=true and autostart=true, supervisor PID/state remain live, and serial recovery TTY stays available"
graphical_session_stop = "Packaged recovery command writes an atomic graceful-stop request; the DRM-Wayland loop observes it in bounded input-dispatch slices, skips remaining scripted interactions, terminates external clients through normal ownership, restores CRTC, releases native GBM scanout resources, records stopped supervisor state, removes the PID file, and returns to recovery; QEMU verifies the complete path"
graphics_qemu_visible_boot_check = "QEMU recovery first QEMU-visible boot path check consumes the explicit runner result, marks the VM display path ready for manual observation, records qemu_vm_display_observed=false, and keeps persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
graphics_qemu_observation_marker = "QEMU recovery manual VM-display observation marker consumes the visible boot path check and records qemu_vm_display_observed=false by default, or true only when explicitly requested, while keeping persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
qemu_visible_evidence_record = "QEMU visible evidence record consumes the visible boot path check, records operator capture metadata, and is required before AQUA_QEMU_VM_DISPLAY_OBSERVED=true can produce a positive observation while preserving persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
host_qemu_visible_capture = "Host-side scripts/capture-qemu-visible-manual.sh captures the operator-visible QEMU display with an available platform screenshot tool, writes capture metadata for aqua-qemu-visible-evidence-record, and does not start QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_preflight = "Host-side scripts/preflight-qemu-visible-manual.sh verifies QEMU, kernel/rootfs artifacts, capture tooling, and packaged recovery observation commands before the manual visible pass without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_readiness_watch = "Host-side scripts/watch-qemu-visible-readiness.sh watches the QEMU serial log for the recovery-ready marker before operator capture and prints the next capture/evidence commands without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_ready_capture_flow = "Host-side scripts/run-qemu-visible-ready-capture-flow.sh combines serial readiness watch, operator-visible capture, SHA-256 verification, evidence bundle writing, and recovery paste-prep for an already launched manual QEMU pass without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_capture_verify = "Host-side scripts/verify-qemu-visible-capture.sh validates an operator capture file or metadata env file, computes a checksum when available, and prints the matching aqua-qemu-visible-evidence-record command without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_evidence_bundle = "Host-side scripts/write-qemu-visible-evidence-bundle.sh consumes verified QEMU VM-display capture metadata and writes the recovery shell evidence/observation command bundle without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_evidence_apply_prep = "Host-side scripts/prepare-qemu-visible-evidence-apply.sh validates a generated evidence bundle and prints a paste-safe QEMU recovery shell heredoc plus explicit operator-confirmed apply command without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
host_qemu_visible_evidence_flow = "Host-side scripts/run-qemu-visible-evidence-flow.sh chains capture verification, evidence bundle writing, and paste-safe recovery apply preparation from an existing capture while preserving operator control and without starting QEMU, boot graphics, compositor autostart, or a persistent desktop session"
qemu_visible_evidence_bundle_apply = "QEMU recovery command aqua-qemu-visible-evidence-bundle-apply consumes a copied host evidence bundle, defaults to waiting-for-operator-confirmation, and only writes a positive observed marker when AQUA_QEMU_VM_DISPLAY_OPERATOR_CONFIRMED=true is explicit while preserving boot_graphics=false and autostart=false"
graphics_qemu_observation_positive = "QEMU recovery positive VM-display observation dry-run invokes the observation marker with AQUA_QEMU_VM_DISPLAY_OBSERVED=true after the evidence record exists, records qemu_vm_display_observed=true, and still keeps persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
qemu_visible_manual_runbook = "QEMU manual VM-display runbook pairs scripts/run-qemu-visible-manual.sh with the recovery-shell command sequence, requires visual operator confirmation before AQUA_QEMU_VM_DISPLAY_OBSERVED=true, avoids Docker at run time, and keeps persistent_graphical_session_started=false, boot_graphics=false, and autostart=false"
manual_compositor_launch = "QEMU-safe recovery shell launch plan validates session config, session env, runtime dir, display activation readiness, fallback TTY, autostart=false, and boot_graphics=false without starting display output or the desktop shell"
guarded_compositor_run = "QEMU-safe recovery shell bounded run validates the manual launch plan, starts and stops three nested-dev display-output smoke frames, preserves fallback TTY, and keeps autostart=false, boot_graphics=false, renderer_started=false, and desktop_shell_started=false"
nested_preview_handoff_gate = "QEMU-safe recovery shell gate validates guarded run, display-output handoff, visible preview readiness, nested preview loop, and manual nested backend path before allowing manual operator promotion; automatic promotion remains false"
client_window_model = "deterministic pre-client contract for focus, move, resize, close, stacking, and shared Aqua window chrome before a real Wayland client surface is displayed"
first_party_bright_window_chrome = "Files, Settings, Terminal, and Properties consume the shared WindowFrame geometry for surface, titlebar, traffic controls, title text, move target, and bottom-right resize grip plus bounded renderer palettes; close, minimize, maximize, move, and resize route from those exact rectangles, terminal content alone retains its dark monospace scrim, and Installer retains its separate responsive full-output layout until explicitly migrated"
runtime_theme_palettes = "AquaTheme bounds LightWhite, Softtouch, Deepside, and Nightmare; Settings atomically persists one optional v1 theme key with LightWhite fallback for legacy or invalid configuration, and Files, Settings, Terminal, Properties, Installer, and the desktop shell load and live-refresh the selected palette"
runtime_shell_theme_palettes = "the compositor applies one shared ShellPalette to the top bar, Applications, Search, three-group bottom shell, desktop icons and context menu, system overview, session menu, and notifications in both CPU fallback and GPU texture paths; themed textures replace legacy generic system-surface shading"
installer_theme_palettes = "all seven Rust-rendered Installer setup screens load the persisted or AQUA_THEME-selected LightWhite, Softtouch, Deepside, or Nightmare palette on launch; fields, controls, focus, text, and inverse dark-theme branding share renderer tokens while semantic success, warning, and destructive states remain distinct"
runtime_live_theme_broadcast = "the desktop and first-party Wayland clients poll the atomically persisted theme at a bounded 100 ms interval; real changes invalidate GPU Shell texture state and redraw open Files, Settings, Terminal, Properties, and Installer buffers without process restart while identical values are idempotent"
runtime_live_theme_qemu = "the graphical QEMU acceptance path atomically changes LightWhite to Deepside with Files and Settings open, verifies Shell and both client redraw markers without PID replacement, captures both frames, and requires a bounded pixel-delta threshold before emitting desktop-live-theme-qemu status=ok"
workspace_window_assignment = "each mapped XDG toplevel owns one of three bounded workspaces; active-workspace filtering controls rendering, focus, pointer hit testing, raising, damage revisions, and cleanup while duplicate app activation switches to the owning workspace before raising the existing surface"
workspace_input = "Ctrl+Alt+Left/Right switches workspaces, Ctrl+Alt+Shift+Left/Right moves the focused window, and bottom-shell workspace thumbnails activate the same bounded state transition"
workspace_qemu = "dedicated QEMU acceptance launches Files and Settings, moves both to workspace 2 without restarting either process, captures empty and populated scanouts with a required visible frame delta, crosses into workspace 3, and returns through a clean supervised session stop"
public_runtime_screenshots = "one QEMU x86_64 TCG session captures the clean desktop, Applications, Global Search with a real set query, and concurrent Aqua Files plus Aqua Settings; publication requires the exact acceptance marker, 1280x800 nonblank distinct PNGs, a clean supervised stop, and a committed SHA-256 provenance manifest"
client_surface_lifecycle = "deterministic pre-client xdg-toplevel lifecycle contract for created, configured, committed, mapped, focused, unmapped, and destroyed surface flow before a real Wayland client is displayed"
client_surface_registry = "two-client xdg-toplevel registry contract tracks active and inactive client ids, surface ids, window ids, configure serials, lifecycle states, focus index, stacking order, close capability, per-surface wl_shm buffer attach/commit metadata, and server-side shm import/sample checksum without renderer binding, display output, boot graphics, or compositor autostart"
renderer_surface_sources = "sampled wl_shm client surface records are converted into renderer-facing source descriptors with z-order, active focus, buffer metadata, import readiness, and checksum without drawing pixels or starting display output"
client_layer_pipeline = "renderer-facing wl_shm client sources carry server-sampled checksum, center pixel, 2x2 sample-grid metadata, and full-buffer snapshot/scaling support into client-layer paint steps and a deterministic headless raster probe without DRM, KMS, Wayland output, boot graphics, or compositor autostart"
xdg_shell_binding = "Smithay XdgShellState global and handler contract for xdg_wm_base, toplevel configure callback, and popup callback readiness before a real Wayland client is displayed"
xdg_toplevel_client = "two minimal in-process xdg_wm_base test clients each create a wl_surface, request an xdg_toplevel, create and attach a wl_shm ARGB8888 buffer after configure, record server-side toplevels, acknowledge the real Smithay configure handler, receive server close events, and exit without renderer, display output, boot graphics, or compositor autostart"
xdg_toplevel_window_model = "two recorded xdg-toplevel client surfaces are bound into distinct compositor ManagedClientWindow entries with Aqua chrome, focus, stacking, map state, and geometry without renderer, display output, boot graphics, or compositor autostart"
smithay_launcher_seat = "real Linux and packaged musl Buildroot probes create the Aqua Seat wl_seat global with keyboard and pointer capabilities, intercept a compositor key event to open the launcher, dispatch pointer motion/button events, select Settings, and include the visible launcher in the render plan; rootfs execution uses packaged libxkbcommon and XKB rules with host_stub=false"
notification_center = "bounded FIFO notification state sanitizes text, uses one monotonic clock and a 30-second interactive timeout, promotes queued items on dismissal or timeout, intercepts the toast close target in Smithay, and composites title, body, source, icon, and close affordance as a GPU texture over the system-surface notification surface; QEMU pointer input closes notification 1 and proves notification 2 is promoted with zero queued"
system_overview = "persistent shell model reads bounded Aqua Linux identity, hostname, kernel, uptime, load, and memory values from /etc and /proc, refreshes on a 60-second cadence only when values change, and composites the text-rich overview as a GPU texture over its system surface; QEMU proves the panel is visible in the production DRM-Wayland session"
desktop_icons = "persistent Files, Settings, and Trash icon state supports pointer selection, bounded double-click activation, right-click context state, and empty-area deselection; selection and menu content render as a GPU texture, Files and Settings reuse strict first-party launch preflight, unit tests cover activation and context behavior, and QEMU proves real pointer selection plus GPU repaint"
desktop_properties = "packaged Aqua Properties is a supervised 480x300 xdg-toplevel with app_id aqua.properties; desktop context actions pass only allowlisted Files, Settings, or Trash targets, bounded metadata renders into wl_shm, and target-specific read-only F5 actions refresh folder contents or verify the Settings application before committing a new generation; QEMU proves generation 1 repaint, native composition, clean Alt+F4 exit, stale-surface removal, and restart_policy=never"
qemu_evdev_aqua_seat = "bounded packaged QEMU low-level probe reads explicit virtio input_event records while the shared DRM-Wayland session discovers seat0 devices through libinput/udev; both dispatch Super key, relative pointer motion, and button events into Smithay Aqua Seat, open the launcher, and return to text recovery with boot graphics and autostart disabled"
qemu_persistent_input = "the production graphical QEMU check owns one persistent HMP connection behind a Unix control socket for all keyboard, pointer, and screendump operations; a focused Settings burst proves 24 forwarded keyboard events and 17 host pointer commands with explicit virtio motion coalescing, then the same run completes application cleanup, session-menu capture, and two compositor start-stop cycles"
session_menu_visual = "the current session menu uploads a native 512x293 transparent content texture over a compositor-owned surface and uses compact title-case actions, selection state, edge treatment, and a confirmation footer; production QEMU captures the surface before executing Recovery, while final styling follows the new interface contract"
icon_rasterization = "the renderer validates the 13 reviewed project-authored Aqua Core SVGs against a bounded no-script, no-text, no-filter, no-raster, no-external-reference subset; resvg runs without default resource features, rasterizes directly at 16, 20, 24, 32, 48, 64, and 128 logical pixels for all four supported output scales, and stores theme/state variants in a 256-entry LRU keyed by source revision, role, theme, state, logical size, and scale; the live compositor now uses that cache for top bar, desktop, dock, and notification textures"

[scope]
first_mode = "nested-dev"
later_mode = "qemu-drm-kms"
product_target = "custom Wayland compositor"
not_a_desktop_theme = true

[dependency_policy]
crate_dependency_added = true
feature_policy = "default binary is recovery-safe; enable smithay-smoke for real Linux Smithay smoke"

[image_packaging]
binary_target = "x86_64-unknown-linux-musl"
binary_path = "/usr/bin/aqua-compositor"
build_script = "scripts/build-compositor-linux-docker.sh"
post_build_copy = "optional"
autostart = false
boot_graphics = false

[planned_features]
wayland_display = true
event_loop = true
nested_backend = true
drm_kms_backend = true
libinput = true
udev = true
rendering = "Smithay GLES/GBM renders the Aqua layered system-surface scene and all bounded live wl_shm session snapshots directly into native GBM front/back dma-bufs in QEMU; initial, stacking, Files, Settings, client cleanup, and empty-desktop repaint routes complete KMS page flips without CPU scanout copies or framebuffer readback, while isolated offscreen probes retain deterministic readback verification"
