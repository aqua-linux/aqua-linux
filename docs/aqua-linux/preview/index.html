<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aqua Linux Interface Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="desktop">
      <header class="topbar">
        <div class="identity">
          <img class="mark" src="../assets/aqua-symbol-primary.png" alt="" />
          <strong>Aqua Linux</strong>
        </div>
        <time>May 20. &nbsp; 10:30 AM</time>
        <div class="status" aria-label="Mock system status">
          <span>VOL</span><span>WIFI</span><span>PWR</span>
        </div>
      </header>

      <section class="applications" aria-label="Applications preview">
        <label class="search">
          <span>Search apps...</span>
        </label>
        <div class="app-grid">
          <a href="#"><img src="../assets/temp-icons/lucide/terminal.svg" alt="" /><span>Terminal</span></a>
          <a href="#"><img src="../assets/temp-icons/lucide/files.svg" alt="" /><span>Files</span></a>
          <a href="#"><img src="../assets/temp-icons/lucide/browser.svg" alt="" /><span>Web Browser</span></a>
          <a href="#"><img src="../assets/temp-icons/lucide/settings.svg" alt="" /><span>Settings</span></a>
          <a href="#"><img src="../assets/temp-icons/lucide/software.svg" alt="" /><span>Software</span></a>
          <a href="#"><img src="../assets/temp-icons/lucide/trash.svg" alt="" /><span>Trash</span></a>
        </div>
      </section>

      <nav class="bottom-controls" aria-label="Desktop controls">
        <div class="control-group">
          <button class="active" title="Applications">APP</button>
          <button title="Search">FIND</button>
        </div>
        <div class="control-group dock" aria-label="Running applications">
          <button title="Terminal"><img src="../assets/temp-icons/lucide/terminal.svg" alt="" /></button>
          <button title="Files"><img src="../assets/temp-icons/lucide/files.svg" alt="" /></button>
          <button title="Browser"><img src="../assets/temp-icons/lucide/browser.svg" alt="" /></button>
          <button title="Settings"><img src="../assets/temp-icons/lucide/settings.svg" alt="" /></button>
          <button title="Trash"><img src="../assets/temp-icons/lucide/trash.svg" alt="" /></button>
        </div>
        <div class="control-group workspaces" aria-label="Workspaces">
          <button class="active" title="Workspace 1"></button>
          <button title="Workspace 2"></button>
          <button title="Workspace 3"></button>
        </div>
      </nav>
    </main>
  </body>
</html>
